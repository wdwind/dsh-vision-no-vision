# Keyless smoke test composition (no API key, no real model).
#
# Run from this directory with the vendored Cordis bin (see README):
#
#   node --import tsx <deepseek-harness-checkout>/vendor/cordis/bin.js
#
# Bare names and relative specifiers resolve from this directory: the
# @deepseek-ai packages come from this project's node_modules (pnpm install),
# and the checkout only supplies the dev bin.
#
# dsh-llm mounts the LlmRuntime service (ctx.llm); the plugin's config pins an
# explicit route that the driver's mock adapter serves.
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-llm'
- name: '../src/index.ts'
  config:
    provider: smoke
    model: smoke-model
- name: './driver.ts'
