# Development overlay: inserts this plugin into the `web` profile.
#
# Run from the deepseek-harness checkout root:
#
#   pnpm dsh web --patch C:/D/Code/dsh-vision-without-vision-model/cordis.patch.yml
#
# The plugin path must be ABSOLUTE: a patch file contributes configuration but
# does not change the profile directory the loader resolves module paths from.
# The row below points straight at this repo's source — the harness checkout
# itself is never touched.
#
# The distributed form lives in bundle/cordis.patch.yml (a row that references
# this package by NAME, for `dsh plugin --profile <name> add` installs).
- insert:
    - id: vision-nv
      name: 'C:/D/Code/dsh-vision-without-vision-model/src/index.ts'
